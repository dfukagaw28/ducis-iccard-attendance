<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信を一切禁止する（fetch/XHR/画像/フォーム送信/外部スクリプトすべて不可）。
     スクリプトは同じサイト内に置いた vendor/xlsx.full.min.js（SheetJS）とページ内のもののみ許可 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>出席取りまとめ</title>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#666; --line:#ddd; --accent:#2563eb; --head:#f3f4f6;
          --ok:#15803d; --ng:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#aaa; --line:#333; --accent:#60a5fa; --head:#1f2937;
            --ok:#4ade80; --ng:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height:1.5; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  a { color: var(--accent); }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; }
  .drop.over { border-color: var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin: 12px 0; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.sub { background: transparent; color: var(--accent); }
  ul { margin: 8px 0; padding-left: 20px; font-size: .9rem; }
  li { margin: 4px 0; }
  select { max-width: 100%; }
  .wrap { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  th { position: sticky; top: 0; background: var(--head); }
  td.ok { color: var(--ok); }
  td.ng { color: var(--ng); }
  .err { color: var(--ng); }
</style>
</head>
<body>
<main>
  <h1>出席取りまとめ</h1>
  <p class="note">出席簿（Excel）の学生ごとに、出席データ（CSV）に記録があれば「出席」、なければ「欠席」とします。
    処理はすべてこのブラウザ内で行い、データはどこにも送信されません。</p>

  <h2>1. 出席簿（Excel）</h2>
  <div class="drop" id="rosterDrop">
    <p class="note">「学生ID」「表示用氏名」の列がある .xlsx / .xls をドラッグ＆ドロップ、または</p>
    <input type="file" id="rosterPicker" accept=".xlsx,.xls,.xlsm">
  </div>
  <p id="rosterInfo" class="note"></p>

  <h2>2. 出席データ（CSV・複数可）</h2>
  <div class="drop" id="csvDrop">
    <p class="note">CSVファイルをドラッグ＆ドロップ、または</p>
    <input type="file" id="csvPicker" accept=".csv,text/csv" multiple>
  </div>
  <div class="row">
    <label>文字コード:
      <select id="enc">
        <option value="auto">自動判定</option>
        <option value="utf-8">UTF-8</option>
        <option value="shift_jis">Shift_JIS</option>
      </select>
    </label>
    <label><input type="radio" name="mode" value="each" checked> CSVごとに列を作る</label>
    <label><input type="radio" name="mode" value="all"> 全CSVをまとめて1列</label>
  </div>
  <p class="note">各CSVで学生IDが入っている列は自動で選びます（出席簿のIDと一致する件数が最も多い列）。違う場合は選び直してください。</p>
  <ul id="csvList"></ul>

  <h2>3. 結果</h2>
  <div class="row">
    <button id="save" disabled>CSVで保存</button>
    <button id="clear" class="sub">すべてクリア</button>
    <span id="summary" class="note"></span>
  </div>
  <div class="wrap"><table id="preview"></table></div>

  <p class="note" style="margin-top:24px"><a href="merge.html">CSVを結合するだけのツールはこちら</a></p>
</main>

<script src="vendor/xlsx.full.min.js"></script>
<script>
'use strict';

const $ = (id) => document.getElementById(id);
// 全角/半角や前後の空白の違いを吸収して比較する
const norm = (v) => String(v ?? '').normalize('NFKC').trim();

// 出席簿: { name, students: [{id, name}] }
let roster = null;
// 出席データ: { name, rows: string[][], col: number, error? }
let csvs = [];
let result = { header: [], rows: [] };

// ---------- 出席簿（Excel）----------
async function loadRoster(file) {
  try {
    if (typeof XLSX === 'undefined') throw new Error('Excel読み込みライブラリが読み込めていません');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let found = null;
    // 「学生ID」「表示用氏名」の見出し行を、全シートの先頭30行から探す
    for (const sheetName of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: '' });
      for (let r = 0; r < Math.min(rows.length, 30); r++) {
        const h = rows[r].map(norm);
        const idCol = h.indexOf('学生ID'), nameCol = h.indexOf('表示用氏名');
        if (idCol >= 0 && nameCol >= 0) { found = { sheetName, rows, r, idCol, nameCol }; break; }
      }
      if (found) break;
    }
    if (!found) throw new Error('「学生ID」と「表示用氏名」の見出しが見つかりません');
    const students = found.rows.slice(found.r + 1)
      .map(row => ({ id: norm(row[found.idCol]), name: norm(row[found.nameCol]) }))
      .filter(s => s.id !== '');
    if (!students.length) throw new Error('学生のデータがありません');
    roster = { name: file.name, sheet: found.sheetName, students };
    $('rosterInfo').className = 'note';
    $('rosterInfo').textContent = `${file.name}（シート「${found.sheetName}」）から ${students.length}名を読み込みました`;
  } catch (e) {
    roster = null;
    $('rosterInfo').className = 'err';
    $('rosterInfo').textContent = `${file.name}: 読み込み失敗（${e.message}）`;
  }
  // 名簿が変わったらCSVの学生ID列を選び直す
  for (const c of csvs) if (!c.error) c.col = guessColumn(c.rows);
  rebuild();
}

// ---------- 出席データ（CSV）----------
// RFC 4180 準拠の簡易CSVパーサ（ダブルクォート、改行入りセル対応）
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', i = 0, inQ = false;
  if (text.charCodeAt(0) === 0xFEFF) i = 1; // BOM除去
  for (; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function toCSV(header, rows) {
  const esc = (v) => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return [header, ...rows].map(r => r.map(v => esc(v ?? '')).join(',')).join('\r\n') + '\r\n';
}

function decode(buf) {
  const enc = $('enc').value;
  if (enc !== 'auto') return new TextDecoder(enc).decode(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('shift_jis').decode(buf); }
}

const colCount = (rows) => rows.reduce((m, r) => Math.max(m, r.length), 0);

// 出席簿の学生IDと一致する値が最も多い列を学生ID列とみなす
function guessColumn(rows) {
  const n = colCount(rows);
  if (!roster) {
    const h = (rows[0] || []).map(norm);
    const i = h.findIndex(v => /学生ID|学籍番号|^ID$/i.test(v));
    return i >= 0 ? i : 0;
  }
  const ids = new Set(roster.students.map(s => s.id));
  let best = 0, bestHits = -1;
  for (let j = 0; j < n; j++) {
    const hits = rows.filter(r => ids.has(norm(r[j]))).length;
    if (hits > bestHits) { best = j; bestHits = hits; }
  }
  return best;
}

async function addCSVs(fileList) {
  for (const f of fileList) {
    try {
      const rows = parseCSV(decode(await f.arrayBuffer()));
      if (!rows.length) throw new Error('空のファイルです');
      csvs.push({ name: f.name, rows, col: guessColumn(rows) });
    } catch (e) {
      csvs.push({ name: f.name, error: e.message });
    }
  }
  rebuild();
}

// ---------- 集計 ----------
function rebuild() {
  renderCSVList();
  const ok = csvs.filter(c => !c.error);
  if (!roster || !ok.length) {
    result = { header: [], rows: [] };
    $('summary').textContent = !roster ? '出席簿を読み込んでください' : '出席データを読み込んでください';
    return renderTable();
  }
  const idSets = ok.map(c => new Set(c.rows.map(r => norm(r[c.col])).filter(v => v !== '')));
  const mark = (b) => b ? '出席' : '欠席';
  let header, rows;
  if (document.querySelector('input[name=mode]:checked').value === 'all') {
    header = ['学生ID', '表示用氏名', '出欠'];
    rows = roster.students.map(s => [s.id, s.name, mark(idSets.some(set => set.has(s.id)))]);
  } else {
    header = ['学生ID', '表示用氏名', ...ok.map(c => c.name.replace(/\.csv$/i, ''))];
    if (ok.length > 1) header.push('出席回数');
    rows = roster.students.map(s => {
      const flags = idSets.map(set => set.has(s.id));
      const r = [s.id, s.name, ...flags.map(mark)];
      if (ok.length > 1) r.push(String(flags.filter(Boolean).length));
      return r;
    });
  }
  result = { header, rows };
  const present = roster.students.filter(s => idSets.some(set => set.has(s.id))).length;
  $('summary').textContent = `${roster.students.length}名中、いずれかのCSVに記録あり ${present}名`;
  renderTable();
}

function renderCSVList() {
  const ids = roster ? new Set(roster.students.map(s => s.id)) : null;
  $('csvList').replaceChildren(...csvs.map((c, k) => {
    const li = document.createElement('li');
    if (c.error) {
      li.className = 'err';
      li.textContent = `${c.name}: 読み込み失敗（${c.error}）`;
      return li;
    }
    li.append(`${c.name}（${c.rows.length}行） 学生ID列: `);
    const sel = document.createElement('select');
    const first = c.rows[0] || [];
    for (let j = 0; j < colCount(c.rows); j++) {
      const o = new Option(`${j + 1}列目: ${first[j] ?? ''}`.slice(0, 40), j);
      o.selected = j === c.col;
      sel.add(o);
    }
    sel.addEventListener('change', () => { c.col = Number(sel.value); rebuild(); });
    li.append(sel);
    if (ids) {
      const vals = new Set(c.rows.map(r => norm(r[c.col])).filter(v => v !== ''));
      const hit = [...vals].filter(v => ids.has(v)).length;
      const info = document.createElement('span');
      info.className = hit ? 'note' : 'err';
      info.textContent = ` 出席簿と一致 ${hit}名` + (hit ? '' : '（列や出席簿を確認してください）');
      li.append(info);
    }
    const del = document.createElement('button');
    del.className = 'sub';
    del.style.cssText = 'padding:0 8px;margin-left:8px;font-size:.8rem';
    del.textContent = '削除';
    del.addEventListener('click', () => { csvs.splice(k, 1); rebuild(); });
    li.append(del);
    return li;
  }));
}

function renderTable() {
  $('save').disabled = result.rows.length === 0;
  const table = $('preview');
  table.replaceChildren();
  if (!result.header.length) return;
  const thead = table.createTHead().insertRow();
  for (const h of result.header) { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); }
  const tbody = table.createTBody();
  for (const r of result.rows) {
    const tr = tbody.insertRow();
    for (const v of r) {
      const td = tr.insertCell();
      td.textContent = v;
      if (v === '出席') td.className = 'ok';
      else if (v === '欠席') td.className = 'ng';
    }
  }
}

function save() {
  // Excelで文字化けしないようBOM付きUTF-8で出力
  const blob = new Blob(['﻿' + toCSV(result.header, result.rows)], { type: 'text/csv' });
  const a = document.createElement('a');
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  a.download = `出席取りまとめ_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- イベント ----------
function setupDrop(el, onFiles) {
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('over'); onFiles(e.dataTransfer.files); });
}
setupDrop($('rosterDrop'), (files) => files[0] && loadRoster(files[0]));
setupDrop($('csvDrop'), addCSVs);
$('rosterPicker').addEventListener('change', (e) => { e.target.files[0] && loadRoster(e.target.files[0]); e.target.value = ''; });
$('csvPicker').addEventListener('change', (e) => { addCSVs(e.target.files); e.target.value = ''; });
// ドロップ枠の外に落とした場合にブラウザがファイルを開いてしまうのを防ぐ
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', rebuild));
$('save').addEventListener('click', save);
$('clear').addEventListener('click', () => {
  roster = null; csvs = [];
  $('rosterInfo').textContent = '';
  rebuild();
});
rebuild();
</script>
</body>
</html>
