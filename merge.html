<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信を一切禁止する（fetch/XHR/画像/フォーム送信/外部スクリプトすべて不可） -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>CSVまとめツール</title>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#666; --line:#ddd; --accent:#2563eb; --head:#f3f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#aaa; --line:#333; --accent:#60a5fa; --head:#1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height:1.5; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; }
  #drop.over { border-color: var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin: 12px 0; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.sub { background: transparent; color: var(--accent); }
  ul#files { margin: 8px 0; padding-left: 20px; font-size: .9rem; }
  .wrap { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  th { position: sticky; top: 0; background: var(--head); }
  .err { color: #dc2626; }
</style>
</head>
<body>
<main>
  <h1>CSVまとめツール</h1>
  <p class="note"><a href="./">← 出席取りまとめへ</a><br>複数のCSVを読み込んで1つにまとめ、CSVで保存します。処理はすべてこのブラウザ内で行い、データはどこにも送信されません。</p>

  <div id="drop">
    <p>CSVファイルをここにドラッグ＆ドロップ、または</p>
    <input type="file" id="picker" accept=".csv,text/csv" multiple>
  </div>

  <div class="row">
    <label>文字コード:
      <select id="enc">
        <option value="auto">自動判定</option>
        <option value="utf-8">UTF-8</option>
        <option value="shift_jis">Shift_JIS</option>
      </select>
    </label>
    <label><input type="checkbox" id="addName"> 元ファイル名の列を追加</label>
    <label><input type="checkbox" id="dedupe"> 重複行を除く</label>
  </div>

  <ul id="files"></ul>

  <div class="row">
    <button id="save" disabled>CSVで保存</button>
    <button id="clear" class="sub" disabled>クリア</button>
    <span id="summary" class="note"></span>
  </div>

  <div class="wrap"><table id="preview"></table></div>
</main>

<script>
'use strict';

// 読み込んだファイル: { name, header: string[], rows: string[][] }
let loaded = [];
let merged = { header: [], rows: [] };

const $ = (id) => document.getElementById(id);

// RFC 4180 準拠の簡易CSVパーサ（ダブルクォート、改行入りセル対応）
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', i = 0, inQ = false;
  if (text.charCodeAt(0) === 0xFEFF) i = 1; // BOM除去
  for (; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  // 完全な空行は捨てる
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function toCSV(header, rows) {
  const esc = (v) => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return [header, ...rows].map(r => r.map(v => esc(v ?? '')).join(',')).join('\r\n') + '\r\n';
}

function decode(buf) {
  const enc = $('enc').value;
  if (enc !== 'auto') return new TextDecoder(enc).decode(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('shift_jis').decode(buf); }
}

async function addFiles(fileList) {
  for (const f of fileList) {
    try {
      const rows = parseCSV(decode(await f.arrayBuffer()));
      if (!rows.length) throw new Error('空のファイルです');
      loaded.push({ name: f.name, header: rows[0].map(h => h.trim()), rows: rows.slice(1) });
    } catch (e) {
      loaded.push({ name: f.name, error: e.message });
    }
  }
  rebuild();
}

// 見出し名で列を揃えて結合（列の和集合、初出順）
function rebuild() {
  const ok = loaded.filter(f => !f.error);
  const header = [];
  for (const f of ok) for (const h of f.header) if (!header.includes(h)) header.push(h);
  const addName = $('addName').checked;
  const outHeader = addName ? ['元ファイル', ...header] : header;

  let rows = [];
  for (const f of ok) {
    const idx = header.map(h => f.header.indexOf(h));
    for (const r of f.rows) {
      const out = idx.map(j => j < 0 ? '' : (r[j] ?? ''));
      rows.push(addName ? [f.name, ...out] : out);
    }
  }
  if ($('dedupe').checked) {
    const seen = new Set();
    rows = rows.filter(r => { const k = JSON.stringify(r); return seen.has(k) ? false : (seen.add(k), true); });
  }
  merged = { header: outHeader, rows };
  render();
}

function render() {
  $('files').replaceChildren(...loaded.map(f => {
    const li = document.createElement('li');
    li.textContent = f.error ? `${f.name}: 読み込み失敗（${f.error}）` : `${f.name}（${f.rows.length}行）`;
    if (f.error) li.className = 'err';
    return li;
  }));

  const has = merged.rows.length > 0;
  $('save').disabled = !has;
  $('clear').disabled = loaded.length === 0;
  $('summary').textContent = loaded.length ? `合計 ${merged.rows.length}行 / ${merged.header.length}列` : '';

  const LIMIT = 200;
  const table = $('preview');
  table.replaceChildren();
  if (!merged.header.length) return;
  const thead = table.createTHead().insertRow();
  for (const h of merged.header) { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); }
  const tbody = table.createTBody();
  for (const r of merged.rows.slice(0, LIMIT)) {
    const tr = tbody.insertRow();
    for (const v of r) tr.insertCell().textContent = v;
  }
  if (merged.rows.length > LIMIT) {
    const td = tbody.insertRow().insertCell();
    td.colSpan = merged.header.length;
    td.className = 'note';
    td.textContent = `…ほか ${merged.rows.length - LIMIT}行（プレビューは先頭${LIMIT}行のみ。保存時は全行出力）`;
  }
}

function save() {
  // Excelで文字化けしないようBOM付きUTF-8で出力
  const blob = new Blob(['﻿' + toCSV(merged.header, merged.rows)], { type: 'text/csv' });
  const a = document.createElement('a');
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  a.download = `まとめ_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('picker').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
// ドロップ枠の外に落とした場合にブラウザがファイルを開いてしまうのを防ぐ
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());
$('addName').addEventListener('change', rebuild);
$('dedupe').addEventListener('change', rebuild);
$('save').addEventListener('click', save);
$('clear').addEventListener('click', () => { loaded = []; rebuild(); });
</script>
</body>
</html>
